name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and Sign APK
        run: |
          set -e
          if [ -f "$ANDROID_HOME/platforms/android-34/android.jar" ]; then
            ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          else
            ANDROID_JAR=$(ls "$ANDROID_HOME/platforms"/android-*/android.jar | sort -V | tail -n 1)
          fi
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -n 1)

          echo "Using ANDROID_JAR: $ANDROID_JAR"
          echo "Using BUILD_TOOLS: $BUILD_TOOLS"

          mkdir -p build/gen build/obj build/compiled_res build/apk

          "$BUILD_TOOLS/aapt2" compile --dir res -o build/compiled_res/res.zip

          "$BUILD_TOOLS/aapt2" link \
            -o build/apk/app-unaligned.apk \
            -I "$ANDROID_JAR" \
            --manifest AndroidManifest.xml \
            --java build/gen \
            build/compiled_res/res.zip

          javac -source 11 -target 11 \
            -classpath "$ANDROID_JAR" \
            -d build/obj \
            $(find src build/gen -name "*.java")

          "$BUILD_TOOLS/d8" \
            --lib "$ANDROID_JAR" \
            --min-api 21 \
            --output build/apk \
            $(find build/obj -name "*.class")

          cd build/apk
          zip -u app-unaligned.apk classes.dex
          cd ../..

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            build/apk/app-unaligned.apk \
            build/apk/app-aligned.apk

          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          "$BUILD_TOOLS/apksigner" sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out simple-notepad-v1.0.apk \
            build/apk/app-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose simple-notepad-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-notepad-apk
          path: simple-notepad-v1.0.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0 >/dev/null 2>&1; then
            gh release upload v1.0 simple-notepad-v1.0.apk --clobber
          else
            gh release create v1.0 simple-notepad-v1.0.apk \
              --title "Simple Notepad v1.0" \
              --notes "Собранный APK-файл приложения Блокнот (simple-notepad-android)."
          fi
